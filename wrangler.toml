# Standard Cloudflare Workers / Pages configuration
name = "webscrape-studio"
main = "worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Path to the built frontend static assets
[assets]
directory = "./dist"

